services:
  postgres-v2:
    build:
      context: ../../audit-engine-v2
      dockerfile: Dockerfile.pgvector
    image: audit-v2-postgis-pgvector:latest
    container_name: audit-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: re_audit
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d re_audit"]
      interval: 5s
      retries: 5
    networks:
      - audit-net

  redis:
    image: redis:7-alpine
    container_name: audit-v2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - audit-net

  api:
    build:
      context: ../../audit-engine-v2
      dockerfile: Dockerfile.api
    container_name: audit-v2-api
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://audit_user:${POSTGRES_PASSWORD:?missing}@postgres-v2:5432/re_audit}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-v2:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports:/app/reports
    command: uvicorn audit_engine.api.app:app --host 0.0.0.0 --port 8000
    networks:
      - audit-net

  mc-worker:
    build:
      context: ../../audit-engine-v2
      dockerfile: Dockerfile
    container_name: audit-v2-mc-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://audit_user:${POSTGRES_PASSWORD:?missing}@postgres-v2:5432/re_audit}
      REDIS_URL: redis://redis:6379/0
      MC_USE_GPU: "false"
    depends_on:
      postgres-v2:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f uvicorn > /dev/null 2>&1"]
      interval: 5s
      retries: 5
    networks:
      - audit-net

networks:
  audit-net:
    driver: bridge

volumes:
  pgdata-v2:
  reports:
