[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-engine"
version = "2.0.0"
description = "СОДИКС Audit Engine — EI Calculator with Monte-Carlo simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "weasyprint>=61",
    "qrcode[pil]>=7.4",
    "markdown>=3.5",
    "plotly>=5.18",
    "kaleido>=0.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
