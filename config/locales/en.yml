      explainer: "EI score combines cash yield, IRR, and risk-adjusted return into a single normalized figure (0–100). Higher = better risk-reward profile vs. local market median."
      explainer_full: "If EI > 1.2 for a given strategy, this purchase method is currently more profitable than the alternative (deposit or rent + save). If EI < 0.8, your money works more efficiently in another instrument. Profitability probability shows the chance of staying in profit across thousands of possible futures."
