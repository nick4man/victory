        pessimistic: "Pessimistic"
      explainer: "100,000 Monte Carlo simulations across mortgage / cash / deposit strategies, with sensitivity to interest-rate moves, vacancy, and price appreciation."
      explainer_full: "Realistic scenario — the default baseline (rates & inflation from the Central Bank of Russia). Optimistic — if inflation and price growth exceed forecasts, rates ease. Pessimistic — the reverse. If 'Best' is identical across all three — the decision is robust; if it changes — weight your own view of the market."
      sensitivity_header: "MORTGAGE EI SENSITIVITY TO RATE"
      sensitivity_intro: "How mortgage EI changes if the actual rate differs from the forecast. Line 1.0 — breakeven threshold."
      sensitivity_explainer: "If you've been offered a lower rate — find it on the horizontal axis and read EI on the right. EI > 1.0 means a mortgage at that rate is already better than a deposit."
