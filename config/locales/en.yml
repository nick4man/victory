      page_title: "Risks, assumptions, glossary"
      risks_header: "Risks and limitations"
      assumptions_header: "Calculation assumptions"
      glossary_header: "Glossary of terms"
      contact_header: "DISCUSS THE REPORT WITH AN ADVISOR"
      terms:
        efficiency_index:
          term: "Efficiency Index"
          body: "Ratio of the deal's useful outcome (projected value + saved rent) to its costs (mortgage payments or opportunity cost of alternative investments). EI ≥ 1.2 — purchase is profitable; ≤ 0.8 — not."
        monte_carlo:
          term: "Monte Carlo method"
          body: "A way to estimate the spread of future outcomes: the engine simulates a million variants of how prices, rates, and inflation could evolve over a 5-year horizon, and computes EI for each. The output is not a single number but a range plus the probability of a good outcome."
        buy_probability:
          term: "Profitability probability"
          body: "Share of Monte Carlo scenarios where EI ended up ≥ 1.2. Higher = more robust decision to future uncertainty."
        market_scenarios:
          term: "Market scenarios"
          body: "Three conditional futures: optimistic (low rates, price growth), realistic (current Central Bank of Russia forecast), and pessimistic (high rates, low growth). Useful to see which scenario breaks the decision."
        strategies:
          term: "Strategies"
          body: "Cash — purchase with own funds at a full-payment discount. Mortgage — purchase with borrowed funds at current market rate. Deposit — DO NOT purchase, keep money on deposit and rent. Best strategy = highest efficiency index."
