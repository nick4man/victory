      loan_amount: "Loan amount"
      total_payments: "Total payments over term"
      total_interest: "Total interest (overpayment)"
      mortgage_explainer: "«Total payments» %{total_payments} — sum of every monthly payment across the full mortgage term (typically 20 years). The audit evaluates on a 5-year horizon — so EI accounts only for what is paid in those 5 years plus residual debt, not the full 20-year overpayment. A 1%% reduction in interest rate materially shifts the efficiency index (see p.3)."
    page_footer: "p.%{page}  ·  Report %{report}"
    scenarios:
      page_title: "Scenarios & sensitivity"
      recommended_strategy: "Recommended strategy"
      confidence_level: "Confidence level"
