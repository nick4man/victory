topnlab_sync:
  cron: "*/30 * * * *"     # every 30 minutes
  class: TopnlabSyncJob
  queue: scheduled
  description: "Pull all in_ad properties from Topnlab CRM and upsert into Property"

# mls_sync disabled — Topnlab API does not expose cross-agency MLS data,
# only our own listings in MLS projection. See MlsSync::TopnlabSyncService.
# Comparable data now comes from external_yrl_sync (Yandex YRL feeds).

topnlab_staff_sync:
  cron: "30 6 * * *"       # daily at 06:30
  class: TopnlabStaffSyncJob
  queue: scheduled
  description: "Sync Topnlab company structure (departments + users) into local Department + User"

topnlab_orders_sync:
  cron: "45 */3 * * *"     # every 3 hours at :45
  class: TopnlabOrdersSyncJob
  queue: scheduled
  description: "Sync Topnlab buyer/renter orders (type=order) into BuyerOrder"

external_yrl_sync:
  cron: "25 */4 * * *"     # every 4 hours at :25
  class: ExternalListings::YrlSyncJob
  queue: scheduled
  description: "Refresh public Yandex Realty YRL feeds from other Ryazan agencies (comp data)"

refresh_topnlab_stats:
  cron: "15 * * * *"       # hourly at :15 (offset from other Topnlab jobs)
  class: RefreshTopnlabStatsJob
  queue: low_priority
  description: "Refresh Topnlab counts cache (processed_requests metric on /landing + /about). Throttled API: full sweep ≈ 8 min."

bank_rates_refresh:
  cron: "0 4 * * SUN"      # weekly Sunday 04:00 MSK
  class: BankRatesRefreshJob
  queue: scheduled
  description: "Refresh deposit/mortgage program rates from banki.ru aggregator"

tg_polling:
  cron: "* * * * *"        # every minute
  class: "Telegram::WorkBot::PollingJob"
  queue: scheduled
  description: "Fallback polling getUpdates когда TG → webhook не доходит (TELEGRAM_POLLING_MODE=true)"

task_batch_expiry:
  cron: "*/10 * * * *"     # every 10 minutes
  class: TaskBatchExpiryJob
  queue: scheduled
  description: "Phase 7.2 — pending TaskBatch > 1h → status=expired (Оксана не подтвердила)"

digest_cleanup:
  cron: "5 0 * * *"        # daily 00:05 Moscow
  class: DigestCleanupJob
  queue: scheduled
  description: "Phase 7.4 — unpin вчерашний digest + seed today's в #ДИСПЕТЧЕРСКОЙ"

kpi_staff_snapshot:
  cron: "55 23 * * *"      # daily 23:55 Moscow
  class: "Kpi::StaffSnapshotJob"
  queue: scheduled
  description: "Phase 7.6 — daily StaffMetric snapshot per assignable TelegramUser"

kpi_agency_digest:
  cron: "0 18 * * *"       # daily 18:00 Moscow
  class: "Kpi::AgencyDigestJob"
  queue: scheduled
  description: "Phase 7.6 — DM директорам с agency-wide сводкой текущего дня"

voice_archive_cleanup:
  cron: "0 4 * * SUN"      # weekly Sunday 04:00 Moscow
  class: "Nextcloud::VoiceArchiveCleanupJob"
  queue: scheduled
  description: "Phase 7.8b — soft-delete voice-archive DocumentUpload > 90 дней (NC файлы остаются)"
