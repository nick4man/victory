# .rubocop_todo.yml — legacy baseline auto-generated
#
# Disables 196 cops с существующими нарушениями в legacy-коде, чтобы
# разблокировать CI. Каждая запись — отдельный bug-debt; убирать по
# одной по мере правок. Refine per-file potом через:
#   bundle exec rubocop --auto-gen-config --exclude-limit 200
#
# Generated from CI log (run #26602951923, 2026-05-28). Counts per cop
# в комментах log: см. /tmp/rubocop_full.log (≈8.5k violations total).
#
# IMPORTANT: новый код должен соблюдать style. Если cop сюда добавлен,
# это не разрешение нарушать в новых файлах — это temporary holdback
# legacy. Поэтому при rubocop -a сначала autocorrect, потом снимаем.

