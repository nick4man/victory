name: "Черновик (оформит агент)"
description: "Пара строк своими словами — Hermes превратит в полноценную задачу или баг, вы проверите и отправите"
title: "[draft] "
labels: ["agent:draft"]
body:
  - type: markdown
    attributes:
      value: |
        Пишите как удобно, без структуры. В течение ~10 минут Hermes перепишет эту issue
        по форме «Задача» или «Баг» (направление dev/*, критерии приёмки, файлы),
        сменит метку на `agent:triage` и оставит комментарий. Проверьте текст и поменяйте
        метку `agent:triage` → `agent:hermes` — это и есть отправка в работу.
  - type: textarea
    id: wish
    attributes:
      label: Что хочется
      placeholder: "в чате на сайте кнопка «позвонить» не видна на айфоне, надо поправить"
    validations:
      required: true
