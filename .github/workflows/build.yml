name: Build images

# Сборка docker-образов всех служб и публикация в GHCR.
#
# - push в main: собрать и запушить тег sha-<7>; если коммит менял VERSION —
#   дополнительно тег <VERSION> (это и есть «релиз»).
# - pull_request: только собрать (без push) + zeitwerk:check у web — проверка,
#   что образ собирается и приложение грузится в production-режиме.
# - workflow_dispatch: как push (sha + VERSION) — ручная пересборка.
#
# Выкатка образов — НЕ здесь: прод тянет образы сам (bin/rollout на хосте),
# у CI нет доступа к прод-серверу. См. docs/ci-cd-pipeline-plan.md, фаза 1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Отменять можно только PR-проверки: убитый mid-push run оставляет коммит
  # без sha-образа в реестре, и bin/rollout sha-<него> становится невозможен.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/nick4man

jobs:
  prep:
    name: Что собираем и с какими тегами
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      push: ${{ steps.meta.outputs.push }}
      services: ${{ steps.meta.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=7 HEAD)
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            PUSH=0
            DIFF_BASE="origin/${{ github.base_ref }}...HEAD"
          else
            PUSH=1
            # push: github.event.before — прошлый tip main; dispatch: сравнивать
            # не с чем, считаем VERSION изменившимся (ручной запуск = релиз).
            DIFF_BASE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
              DIFF_BASE=''
            # force-push / первый push: before нулевой, diff не посчитать —
            # считаем полным прогоном (все службы + VERSION-тег)
            elif [ "${{ github.event.before }}" = '0000000000000000000000000000000000000000' ]; then
              DIFF_BASE=''
            fi
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

          if [ -z "$DIFF_BASE" ] || git diff --name-only "$DIFF_BASE" | grep -qx VERSION; then
            VERSION_TAG=1
          else
            VERSION_TAG=0
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          # Службы services/* собираем только когда их каталоги менялись
          # (на PR сравниваем с base, на push — с before). Релиз (VERSION_TAG=1)
          # и dispatch = полный комплект: иначе <VERSION>-тег служб молча
          # указывал бы на образ прошлого релиза, а bin/release --from-ci
          # падал бы без свежего sha-тега.
          SERVICES='[]'
          for pair in conveyor:services/urgent-news-collector publisher:services/content-publisher zhk-registry:services/zhk-registry; do
            svc=${pair%%:*}; dir=${pair#*:}
            if [ -z "$DIFF_BASE" ] || [ "$VERSION_TAG" = '1' ] || git diff --name-only "$DIFF_BASE" -- "$dir" | grep -q .; then
              SERVICES=$(printf '%s' "$SERVICES" | jq -c --arg s "$svc" --arg c "./$dir" '. + [{service: $s, context: $c}]')
            fi
          done
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  web:
    name: Образ web (+ zeitwerk:check)
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: needs.prep.outputs.push == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build victory-web (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/victory-web:sha-${{ needs.prep.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Приложение обязано грузиться в production-режиме (eager load) — ловит
      # то, что RSpec в test-окружении пропускает. Заглушки явно «не-токенные»:
      # сеть образу не нужна, GitGuardian не должен сработать. БД не нужна:
      # entrypoint (ждёт postgres и db:prepare) подменяем на голый bin/rails.
      - name: zeitwerk:check в production-окружении
        run: |
          docker run --rm --entrypoint bin/rails \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE_DUMMY=1 \
            -e TELEGRAM_BOT_TOKEN=not-a-token-ci-boot-check \
            -e OMNIROUTE_BASE_URL=http://llm.invalid/v1 \
            -e OMNIROUTE_API_KEY=not-a-key-ci-boot-check \
            "$REGISTRY/victory-web:sha-${{ needs.prep.outputs.sha }}" \
            zeitwerk:check

      # Пуш только после успешного zeitwerk:check — сломанный образ в реестр
      # не попадает.
      - name: Push тегов
        if: needs.prep.outputs.push == '1'
        run: |
          set -euo pipefail
          IMG="$REGISTRY/victory-web"
          docker push "$IMG:sha-${{ needs.prep.outputs.sha }}"
          if [ "${{ needs.prep.outputs.version_tag }}" = '1' ]; then
            docker tag "$IMG:sha-${{ needs.prep.outputs.sha }}" "$IMG:${{ needs.prep.outputs.version }}"
            docker push "$IMG:${{ needs.prep.outputs.version }}"
          fi

  services:
    name: Образ ${{ matrix.service }}
    needs: prep
    if: needs.prep.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: needs.prep.outputs.push == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push victory-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: ${{ needs.prep.outputs.push != '1' }}
          push: ${{ needs.prep.outputs.push == '1' }}
          tags: |
            ${{ env.REGISTRY }}/victory-${{ matrix.service }}:sha-${{ needs.prep.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # VERSION-тег натягиваем на уже запушенный sha-образ прямо в реестре,
      # без локальной сборки (imagetools не тянет слои на раннер).
      - name: Тег VERSION
        if: needs.prep.outputs.push == '1' && needs.prep.outputs.version_tag == '1'
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/victory-${{ matrix.service }}:${{ needs.prep.outputs.version }}" \
            "$REGISTRY/victory-${{ matrix.service }}:sha-${{ needs.prep.outputs.sha }}"

  # Автовыкатка на staging после пуша web. Принцип «тянет, не толкает»:
  # CI не собирает и не копирует ничего на хост — он только дёргает
  # bin/deploy-gate по SSH (forced command), а bin/staging-rollout на хосте
  # сам делает pull образа из GHCR. Ключ STAGING_SSH_KEY в authorized_keys
  # связан command= с bin/deploy-gate и ничего больше не умеет.
  #
  # Джобы выключены, пока staging не настроен на хосте: переменная
  # репозитория STAGING_ENABLED=true включает их (docs/runbooks/staging.md).
  staging-rollout:
    name: Выкатка на staging
    needs: [prep, web]
    if: needs.prep.outputs.push == '1' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH-ключ
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: deploy-gate staging-rollout
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_HOST }}" \
            "staging-rollout sha-${{ needs.prep.outputs.sha }}"

  # Навигационный smoke (не визуальные снапшоты: данные staging — копия прода,
  # попиксельное сравнение с dev-базовыми не переживёт). Внешний bin/smoke
  # идёт через Traefik — заодно проверяет маршрут и basic-auth.
  playwright-staging:
    name: Smoke + Playwright против staging
    needs: [prep, staging-rollout]
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://staging.dev.victory62.org
    steps:
      - uses: actions/checkout@v7

      - name: Внешний smoke через Traefik
        env:
          SMOKE_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: bin/smoke "$STAGING_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Playwright staging-smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          PLAYWRIGHT_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: npx playwright test --config=playwright.config.ts staging-smoke

      - name: Артефакты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-results
          path: test-results/
          retention-days: 7
