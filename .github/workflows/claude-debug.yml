name: Claude debug probe

# Стенд для диагностики. push-триггер работает с любой ветки (в отличие от
# workflow_dispatch, который GitHub берёт только с дефолтной), поэтому
# варианты прогоняются без единой правки в main. Удалить после починки.
on:
  push:
    branches: [ci/claude-action-debug]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Ответь ровно одним словом: работает'
          # Публичный лог. На падающем прогоне инструменты не вызываются,
          # в вывод попадает только ответ модели либо текст ошибки.
          show_full_output: true
