name: Claude debug probe

# Стенд для диагностики. pull_request берёт workflow с head-ветки PR, поэтому
# варианты прогоняются без правок в main (push экшен не поддерживает:
# "Unsupported event type: push"; workflow_dispatch GitHub читает только с
# дефолтной ветки). Удалить вместе с веткой после починки.
on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Ответь ровно одним словом: работает'
          # Публичный лог. На падающем прогоне инструменты не вызываются,
          # в вывод попадает только ответ модели либо текст ошибки.
          show_full_output: true
