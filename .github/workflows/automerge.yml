name: Automerge agent PRs

# Автослияние PR агентов в интеграционные ветки dev/* без участия человека.
# Условия — ВСЕ сразу (см. docs/runbooks/agent-pipeline.md):
#   • base — dev/*, head — kanban/* | claude/* | kimi/*  (в main никогда);
#   • на PR есть метка `automerge` (ставит конвейер при создании PR);
#   • последнее ревью Kimi (kimi.yml, job «Kimi Review») закончилось строкой
#     `VERDICT: MERGE`, и оно относится к текущему head SHA;
#   • все check runs на head SHA завершены и зелёные, среди них есть
#     обязательный набор: RuboCop, RSpec, Brakeman, bundler-audit, services-check,
#     образ web, Kimi Review.
# Запускаемся по завершении любого из трёх workflow — кто последним
# позеленел, тот и мержит. Комментарии бота НЕ триггерят workflow (события от
# GITHUB_TOKEN не порождают новых прогонов), поэтому слушаем workflow_run.
on:
  workflow_run:
    workflows: ["Lint & security", "Build images", "Kimi Code"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write      # закрыть связанную issue — closing keywords для base dev/* GitHub игнорирует
  checks: read
  actions: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Слить PR агента в dev/*
    # workflow_run для PR из форков тут не ожидается; PR из веток репозитория — да.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Проверить условия и слить
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Job без checkout: gh pr/issue узнают репозиторий только из GH_REPO.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # --- PR по head SHA --------------------------------------------------
          PR_JSON=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq --arg sha "$SHA" \
            '[.[] | select(.state=="open" and .head.sha==$sha)] | first // empty')
          if [ -z "$PR_JSON" ]; then echo "нет открытого PR для $SHA"; exit 0; fi
          NUM=$(jq -r .number <<<"$PR_JSON")
          BASE=$(jq -r .base.ref <<<"$PR_JSON")
          HEAD=$(jq -r .head.ref <<<"$PR_JSON")
          DRAFT=$(jq -r .draft <<<"$PR_JSON")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON")
          echo "PR #$NUM  $HEAD -> $BASE  labels=[$LABELS] draft=$DRAFT"

          # --- политика веток / меток -------------------------------------------
          case "$BASE" in dev/*) ;; *) echo "base '$BASE' не dev/* — пропуск"; exit 0;; esac
          case "$HEAD" in kanban/*|claude/*|kimi/*) ;; *) echo "head '$HEAD' не агентская — пропуск"; exit 0;; esac
          [[ ",$LABELS," == *",automerge,"* ]] || { echo "нет метки automerge — пропуск"; exit 0; }
          [[ ",$LABELS," == *",needs-human,"* ]] && { echo "метка needs-human — стоп"; exit 0; }
          [ "$DRAFT" = false ] || { echo "draft — пропуск"; exit 0; }

          # --- вердикт Kimi: строго из job «Kimi Review» на этом head -----------
          # Комментарий должен быть от github-actions[bot], ссылаться на run_id того
          # workflow_run «Kimi Code», чей job «Kimi Review» завершился success на $SHA,
          # и иметь ПЕРВОЙ содержательной строкой `HEAD: $SHA`, ПОСЛЕДНЕЙ — `VERDICT: …`.
          # Так интерактивный @kimi (тот же бот, другой job) gate не пройдёт.
          REVIEW_RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=50" --jq \
            '[.workflow_runs[] | select(.name=="Kimi Code" and .status=="completed")] | sort_by(.run_number) | last | .id // empty')
          [ -n "$REVIEW_RUN" ] || { echo "прогон «Kimi Code» на $SHA ещё не завершён — ждём"; exit 0; }
          REVIEW_OK=$(gh api "repos/$REPO/actions/runs/$REVIEW_RUN/jobs" --jq \
            '[.jobs[] | select(.name=="Kimi Review" and .conclusion=="success")] | length')
          [ "$REVIEW_OK" -ge 1 ] || { echo "job «Kimi Review» run $REVIEW_RUN не success — не мержим"; exit 0; }

          VERDICT_BODY=$(gh api "repos/$REPO/issues/$NUM/comments?per_page=100" --paginate --jq \
            ".[] | select(.user.login==\"github-actions[bot]\") | select(.body | contains(\"/actions/runs/$REVIEW_RUN\")) | .body" \
            | tail -n +1)
          [ -n "$VERDICT_BODY" ] || { echo "комментарий ревью для run $REVIEW_RUN не найден — ждём"; exit 0; }
          # Первая содержательная строка после шапки action'а («Kimi finished… / ---») — HEAD:, последняя — VERDICT:.
          FIRST=$(grep -m1 -E '^HEAD: ' <<<"$VERDICT_BODY" || true)
          LAST=$(grep -v '^[[:space:]]*$' <<<"$VERDICT_BODY" | tail -1)
          echo "ревью run=$REVIEW_RUN first='$FIRST' last='$LAST'"
          [ "$FIRST" = "HEAD: $SHA" ] || { echo "ревью не про head $SHA — устарело, ждём свежее"; exit 0; }
          [ "$LAST" = "VERDICT: MERGE" ] || { echo "вердикт не MERGE — не мержим"; exit 0; }
          SHORT=${SHA:0:7}

          # --- check runs на head SHA --------------------------------------------
          # --paginate отдаёт по массиву на страницу — склеиваем в один (jq -s add).
          RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate --jq '.check_runs' | jq -s 'add')
          # Берём последнюю попытку каждого check по имени.
          RUNS=$(jq -c 'group_by(.name) | map(max_by(.started_at))' <<<"$RUNS")
          jq -r '.[] | "\(.status)\t\(.conclusion)\t\(.name)"' <<<"$RUNS" | sort -k3

          PENDING=$(jq -r '[.[] | select(.status!="completed")] | length' <<<"$RUNS")
          [ "$PENDING" = 0 ] || { echo "$PENDING проверок ещё идут — ждём следующего workflow_run"; exit 0; }
          RED=$(jq -r '[.[] | select(.conclusion!="success" and .conclusion!="skipped" and .conclusion!="neutral")] | map(.name) | join(", ")' <<<"$RUNS")
          [ -z "$RED" ] || { echo "красные проверки: $RED — не мержим"; exit 0; }

          for need in "RuboCop" "RSpec" "Brakeman (security)" "bundler-audit (CVEs in Gemfile.lock)" \
                      "Учёт и границы служб" "Образ web (+ zeitwerk:check)" "Kimi Review"; do
            OK=$(jq -r --arg n "$need" '[.[] | select(.name==$n and .conclusion=="success")] | length' <<<"$RUNS")
            [ "$OK" -ge 1 ] || { echo "обязательная проверка «$need» не найдена/не зелёная — ждём"; exit 0; }
          done

          # --- перечитать PR: head, base, метки, draft могли измениться за время проверок
          PR_JSON=$(gh api "repos/$REPO/pulls/$NUM")
          CUR=$(jq -r .head.sha <<<"$PR_JSON")
          [ "$CUR" = "$SHA" ] || { echo "head PR уже $CUR, проверяли $SHA — новый прогон разберётся"; exit 0; }
          BASE=$(jq -r .base.ref <<<"$PR_JSON")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON")
          case "$BASE" in dev/*) ;; *) echo "base сменился на '$BASE' — стоп"; exit 0;; esac
          [[ ",$LABELS," == *",automerge,"* ]] || { echo "метку automerge сняли — стоп"; exit 0; }
          [[ ",$LABELS," == *",needs-human,"* ]] && { echo "поставили needs-human — стоп"; exit 0; }
          [ "$(jq -r .draft <<<"$PR_JSON")" = false ] || { echo "PR перевели в draft — стоп"; exit 0; }
          [ "$(jq -r .state <<<"$PR_JSON")" = open ] || { echo "PR уже не open — стоп"; exit 0; }

          # --- mergeable? -------------------------------------------------------
          for _ in 1 2 3 4 5; do
            M=$(gh api "repos/$REPO/pulls/$NUM" --jq '.mergeable')
            [ "$M" = "null" ] || break; sleep 5
          done
          [ "$M" = true ] || { echo "PR не mergeable ($M) — конфликт с $BASE, нужен ребейз"; \
            gh pr comment "$NUM" --body "🤖 automerge: все условия выполнены, но PR конфликтует с \`$BASE\`. Нужен ребейз на свежий \`$BASE\`."; exit 0; }

          # --- merge: атомарно к проверенному head -------------------------------
          gh pr merge "$NUM" --squash --delete-branch --match-head-commit "$SHA" \
            --subject "$(jq -r .title <<<"$PR_JSON") (#$NUM)" \
            --body "Автослияние в $BASE: CI зелёный, ревью Kimi — VERDICT: MERGE (head $SHORT)."
          echo "PR #$NUM слит в $BASE"

          # --- закрыть issue: closing keywords для base != default branch не работают
          for ISSUE in $(grep -oiE '(closes|fixes|resolves) #[0-9]+' <<<"$(jq -r .body <<<"$PR_JSON")" | grep -oE '[0-9]+' | sort -u); do
            gh issue close "$ISSUE" --reason completed \
              --comment "🤖 Сделано в PR #$NUM, слит в \`$BASE\`. В прод попадёт с ближайшим мержем \`$BASE\` → \`main\`." || true
            gh issue edit "$ISSUE" --remove-label in-progress 2>/dev/null || true
          done
