name: Automerge agent PRs

# Автослияние PR агентов в интеграционные ветки dev/* без участия человека.
# Условия — ВСЕ сразу (см. docs/runbooks/agent-pipeline.md):
#   • base — dev/*, head — kanban/* | claude/* | kimi/*  (в main никогда);
#   • на PR есть метка `automerge` (ставит конвейер при создании PR);
#   • job «OpenCode Review» (kimi.yml) на текущем head успешен и его артефакт
#     opencode-verdict содержит VERDICT: MERGE (комментарии бота не читаем);
#     при падении OpenCode Review — FALLBACK: job «Kimi Review» + артефакт
#     kimi-verdict; ветки без opencode-джоба (до PR #258) идут по kimi-пути
#     автоматически;
#   • все check runs на head SHA завершены и зелёные, среди них есть
#     обязательный набор: RuboCop, RSpec, Brakeman, bundler-audit, services-check,
#     образ web, Kimi Review.
# Запускаемся по завершении любого из трёх workflow — кто последним
# позеленел, тот и мержит. Комментарии бота НЕ триггерят workflow (события от
# GITHUB_TOKEN не порождают новых прогонов), поэтому слушаем workflow_run.
on:
  workflow_run:
    workflows: ["Lint & security", "Build images", "Kimi Code"]
    types: [completed]
  # Внешние проверки (CodeQL, GitGuardian) — отдельные check suites; их
  # завершение workflow_run не порождает, поэтому слушаем и check_suite.
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write      # закрыть связанную issue — closing keywords для base dev/* GitHub игнорирует
  checks: read
  actions: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Слить PR агента в dev/*
    # workflow_run для PR из форков тут не ожидается; PR из веток репозитория — да.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Проверить условия и слить
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Job без checkout: gh pr/issue узнают репозиторий только из GH_REPO.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail

          # --- PR по head SHA --------------------------------------------------
          # gh api --jq не умеет --arg: SHA берём из окружения через env.SHA.
          PRS=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            '[.[] | select(.state=="open" and .head.sha==env.SHA and (.base.ref|startswith("dev/")))]')
          N_PR=$(jq length <<<"$PRS")
          [ "$N_PR" != 0 ] || { echo "нет открытого PR в dev/* для $SHA"; exit 0; }
          [ "$N_PR" = 1 ] || { echo "для $SHA открыто $N_PR PR в dev/* — неоднозначно, человек"; exit 0; }
          PR_JSON=$(jq '.[0]' <<<"$PRS")
          NUM=$(jq -r .number <<<"$PR_JSON")
          BASE=$(jq -r .base.ref <<<"$PR_JSON")
          HEAD=$(jq -r .head.ref <<<"$PR_JSON")
          DRAFT=$(jq -r .draft <<<"$PR_JSON")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON")
          echo "PR #$NUM  $HEAD -> $BASE  labels=[$LABELS] draft=$DRAFT"

          # --- политика веток / меток -------------------------------------------
          case "$BASE" in dev/*) ;; *) echo "base '$BASE' не dev/* — пропуск"; exit 0;; esac
          case "$HEAD" in kanban/*|claude/*|kimi/*) ;; *) echo "head '$HEAD' не агентская — пропуск"; exit 0;; esac
          [[ ",$LABELS," == *",automerge,"* ]] || { echo "нет метки automerge — пропуск"; exit 0; }
          [[ ",$LABELS," == *",needs-human,"* ]] && { echo "метка needs-human — стоп"; exit 0; }
          [ "$DRAFT" = false ] || { echo "draft — пропуск"; exit 0; }

          # --- PR не должен трогать свои же проверки ------------------------------
          # pull_request-workflow берёт kimi.yml/lint.yml из ветки PR, т.е. PR мог бы
          # переписать и ревью, и автослияние. Такие PR — только через человека.
          WF_TOUCHED=$(gh api "repos/$REPO/pulls/$NUM/files?per_page=100" --paginate --jq \
            '.[] | .filename | select(startswith(".github/"))' | head -20)
          if [ -n "$WF_TOUCHED" ]; then
            echo "PR меняет .github/: $WF_TOUCHED — автослияние запрещено"
            gh pr edit "$NUM" --add-label needs-human --remove-label automerge
            gh pr comment "$NUM" --body "🤖 automerge: PR меняет файлы в \`.github/\` (workflow/формы). Такие изменения вливает только человек — снял \`automerge\`, поставил \`needs-human\`."
            exit 0
          fi

          # --- вердикт ревью: OpenCode Review — ОСНОВНОЙ путь, Kimi Review —
          # FALLBACK при его падении. Артефакты создают job'ы kimi.yml в run
          # «Kimi Code» с event=pull_request на этом head; комментарии бота
          # не читаем вовсе — их может оставить любой job под тем же
          # github-actions[bot]. Привязка по пути файла workflow, не по
          # display name — одноимённый workflow в другом файле не подойдёт.
          # Ветки без opencode-джоба (созданы до PR #258) — автоматически по
          # старому kimi-пути.
          REVIEW_RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=50" --jq \
            '[.workflow_runs[] | select(.path==".github/workflows/kimi.yml" and .status=="completed")] | sort_by(.run_number) | last | .id // empty')
          [ -n "$REVIEW_RUN" ] || { echo "прогон «Kimi Code» на $SHA ещё не завершён — ждём"; exit 0; }

          JOBS=$(gh api "repos/$REPO/actions/runs/$REVIEW_RUN/jobs" --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          HAS_OC=$(awk -F'\t' '$1=="OpenCode Review"' <<<"$JOBS" | wc -l)
          OC_OK=$(awk -F'\t' '$1=="OpenCode Review" && $2=="success"' <<<"$JOBS" | wc -l)
          KIMI_OK=$(awk -F'\t' '$1=="Kimi Review" && $2=="success"' <<<"$JOBS" | wc -l)

          # Скачать артефакт-вердикт и проверить привязку к head/run/VERDICT.
          # Возврат 1 = артефакта нет или не MERGE (с сообщением и exit 0 —
          # ждём следующего события, НЕ мержим).
          verdict_from() { # $1 — имя артефакта, $2 — путь файла внутри zip
            local art
            art=$(gh api "repos/$REPO/actions/runs/$REVIEW_RUN/artifacts" --jq \
              "[.artifacts[] | select(.name==\"$1\" and .expired==false)] | first | .id // empty")
            [ -n "$art" ] || { echo "артефакт $1 в run $REVIEW_RUN не найден"; return 1; }
            rm -rf verdict verdict.zip
            gh api "repos/$REPO/actions/artifacts/$art/zip" > verdict.zip
            mkdir -p verdict && unzip -o -q verdict.zip -d verdict
            [ -f "$2" ] || { echo "файл $2 в артефакте $1 не найден"; return 1; }
            cat "$2"
            grep -qx "HEAD: $SHA" "$2" || { echo "вердикт про другой head — стоп"; exit 0; }
            grep -qx "RUN: $REVIEW_RUN" "$2" || { echo "вердикт из другого run — стоп"; exit 0; }
            grep -qx "VERDICT: MERGE" "$2" || { echo "вердикт не MERGE — не мержим"; exit 0; }
          }

          FALLBACK=0
          if [ "$HAS_OC" -ge 1 ]; then
            if [ "$OC_OK" -ge 1 ] && verdict_from opencode-verdict verdict/opencode-verdict.txt; then
              echo "вердикт OpenCode Review — основной путь"
            elif [ "$KIMI_OK" -ge 1 ] && verdict_from kimi-verdict verdict/kimi-verdict.txt; then
              FALLBACK=1
              echo "вердикт Kimi Review — FALLBACK (OpenCode Review упал)"
            else
              echo "ни opencode-verdict, ни fallback kimi-verdict не получен — не мержим"; exit 0
            fi
          else
            # Legacy-ветка (до PR #258): opencode-джоба нет — старый kimi-путь.
            if [ "$KIMI_OK" -ge 1 ] && verdict_from kimi-verdict verdict/kimi-verdict.txt; then
              FALLBACK=1
              echo "legacy-ветка: вердикт Kimi Review"
            else
              echo "job «Kimi Review» run $REVIEW_RUN не success — не мержим"; exit 0
            fi
          fi
          SHORT=${SHA:0:7}

          # --- check runs на head SHA --------------------------------------------
          # --paginate отдаёт по массиву на страницу — склеиваем в один (jq -s add).
          RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate --jq '.check_runs' | jq -s 'add')
          # Берём последнюю попытку каждого check по имени.
          RUNS=$(jq -c 'group_by(.name) | map(max_by(.started_at))' <<<"$RUNS")
          jq -r '.[] | "\(.status)\t\(.conclusion)\t\(.name)"' <<<"$RUNS" | sort -k3

          # Внешние проверки могут дойти позже нас — подождём до ~20 минут, перечитывая.
          for _ in $(seq 1 20); do
            PENDING=$(jq -r '[.[] | select(.status!="completed")] | length' <<<"$RUNS")
            [ "$PENDING" = 0 ] && break
            echo "$PENDING проверок ещё идут — ждём 60с"; sleep 60
            RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate --jq '.check_runs' | jq -s 'add' \
              | jq -c 'group_by(.name) | map(max_by(.started_at))')
          done
          [ "$PENDING" = 0 ] || { echo "проверки не завершились за 20 мин — следующее событие продолжит"; exit 0; }
          if [ "$FALLBACK" = 1 ]; then
            # OpenCode Review падал — его красный чек ожидаем и исключаем
            # из блокирующих (вердикт получен от fallback Kimi Review).
            RUNS=$(jq -c '[.[] | select(.name != "OpenCode Review")]' <<<"$RUNS")
          fi
          RED=$(jq -r '[.[] | select(.conclusion!="success" and .conclusion!="skipped" and .conclusion!="neutral")] | map(.name) | join(", ")' <<<"$RUNS")
          [ -z "$RED" ] || { echo "красные проверки: $RED — не мержим"; exit 0; }

          # Обязательный набор: ревью-проверка зависит от пути вердикта —
          # OpenCode Review (основной) или Kimi Review (fallback/legacy).
          REVIEW_NEED="OpenCode Review"
          if [ "$FALLBACK" = 1 ]; then REVIEW_NEED="Kimi Review"; fi
          for need in "RuboCop" "RSpec" "Brakeman (security)" "bundler-audit (CVEs in Gemfile.lock)" \
                      "Учёт и границы служб" "Образ web (+ zeitwerk:check)" "$REVIEW_NEED"; do
            OK=$(jq -r --arg n "$need" '[.[] | select(.name==$n and .conclusion=="success")] | length' <<<"$RUNS")
            [ "$OK" -ge 1 ] || { echo "обязательная проверка «$need» не найдена/не зелёная — ждём"; exit 0; }
          done

          # --- mergeable? -------------------------------------------------------
          for _ in 1 2 3 4 5; do
            M=$(gh api "repos/$REPO/pulls/$NUM" --jq '.mergeable')
            [ "$M" = "null" ] || break; sleep 5
          done
          [ "$M" = true ] || { echo "PR не mergeable ($M) — конфликт с $BASE, нужен ребейз"; \
            gh pr comment "$NUM" --body "🤖 automerge: все условия выполнены, но PR конфликтует с \`$BASE\`. Нужен ребейз на свежий \`$BASE\`."; exit 0; }

          # --- перечитать PR ПОСЛЕ ожидания mergeable: head, base, метки, draft -----
          PR_JSON=$(gh api "repos/$REPO/pulls/$NUM")
          CUR=$(jq -r .head.sha <<<"$PR_JSON")
          [ "$CUR" = "$SHA" ] || { echo "head PR уже $CUR, проверяли $SHA — новый прогон разберётся"; exit 0; }
          BASE=$(jq -r .base.ref <<<"$PR_JSON")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON")
          case "$BASE" in dev/*) ;; *) echo "base сменился на '$BASE' — стоп"; exit 0;; esac
          [[ ",$LABELS," == *",automerge,"* ]] || { echo "метку automerge сняли — стоп"; exit 0; }
          [[ ",$LABELS," == *",needs-human,"* ]] && { echo "поставили needs-human — стоп"; exit 0; }
          [ "$(jq -r .draft <<<"$PR_JSON")" = false ] || { echo "PR перевели в draft — стоп"; exit 0; }
          [ "$(jq -r .state <<<"$PR_JSON")" = open ] || { echo "PR уже не open — стоп"; exit 0; }

          # --- merge: атомарно к проверенному head -------------------------------
          gh pr merge "$NUM" --squash --delete-branch --match-head-commit "$SHA" \
            --subject "$(jq -r .title <<<"$PR_JSON") (#$NUM)" \
            --body "Автослияние в $BASE: CI зелёный, ревью $REVIEW_NEED — VERDICT: MERGE (head $SHORT)."
          echo "PR #$NUM слит в $BASE"

          # --- закрыть issue: closing keywords для base != default branch не работают
          for ISSUE in $(grep -oiE '(closes|fixes|resolves) #[0-9]+' <<<"$(jq -r .body <<<"$PR_JSON")" | grep -oE '[0-9]+' | sort -u); do
            gh issue close "$ISSUE" --reason completed \
              --comment "🤖 Сделано в PR #$NUM, слит в \`$BASE\`. В прод попадёт с ближайшим мержем \`$BASE\` → \`main\`." || true
            gh issue edit "$ISSUE" --remove-label in-progress 2>/dev/null || true
          done
