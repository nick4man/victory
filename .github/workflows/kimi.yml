name: Kimi Code

# Два режима в одном workflow:
# 1) review — авторевью каждого PR (code-review diff — обязательный этап
#    каждого PR по AGENTS.md, здесь он автоматизирован);
# 2) kimi — бот отвечает на @kimi в issue/PR-комментариях и ревью.
#    @claude — алиас к тому же job'у: claude.yml удалён (OAuth-подписка
#    Claude не продлевается), экшен умеет искать ровно одну trigger_phrase,
#    поэтому фраза подставляется динамически — та, что реально есть
#    в событии.
#
# Два пути авторевью — ОБА сохранены, с приоритетом (решение 23.11.26):
#   - job opencode-review (OpenCode Review): ОСНОВНОЙ путь. OpenCode CLI,
#     OIDC-обменом на краткосрочный OPENCODE_API_KEY сервис-аккаунта Console
#     (без долгоживущего секрета; client_id — в secrets.OPENCODE_CLIENT_ID).
#     Модель opencode-go/glm-5.3, расход — на бюджет Go-подписки. Артефакт
#     opencode-verdict automerge.yml читает ПЕРВЫМ. Невалидный вердикт (пустой
#     транскрипт / нет HEAD/VERDICT) — job падает: сигнал для fallback.
#   - job review (Kimi Review): FALLBACK. xuwenhao/kimi-code-action, KIMI_API_KEY,
#     модель k3.1-pro; запускается только при падении OpenCode Review
#     (needs + result=='failure'). Артефакт kimi-verdict automerge читает,
#     только если opencode-вердикта нет. Якоря (workflow, имя job'а, имя
#     артефакта, формат HEAD/RUN/VERDICT) не трогать.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  # Ручной запуск OpenCode Review на любом открытом PR (по номеру). Запускает
  # только job opencode-review: Kimi Review (xuwenhao/kimi-code-action) привязан
  # к pull_request-событию и из dispatch не достаёт контекст PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер PR для ревью (OpenCode Review)'
        required: true
        type: string

jobs:
  review:
    name: Kimi Review
    # FALLBACK: запускаемся ТОЛЬКО если основной OpenCode Review упал
    # (невалидный/пустой вердикт, OIDC, install). Обычный путь PR →
    # opencode-review. Черновики: opencode пропущен (не failure) — и мы тоже.
    needs: opencode-review
    if: always() && needs.opencode-review.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: read

    # Новый push в PR отменяет устаревшее ревью в полёте.
    concurrency:
      group: kimi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Kimi Review
        id: review
        uses: xuwenhao/kimi-code-action@v0 # для продакшена запиньте на SHA коммита
        with:
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_platform: code
          kimi_model: k3.1-pro

          # Трекинг-прогресс одним sticky-комментарием.
          track_progress: true
          use_sticky_comment: true

          # Наличие prompt переводит action в automation-режим (без @kimi).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Проведи code review этого PR на русском языке. Сначала прочти
            AGENTS.md и .claude/memory/systemPatterns.md — это источник правды
            о проекте (Rails-монолит, доменная логика в app/services/).

            Фокус ревью:
            1. Безопасность: вебхук-контроллеры при пустом ENV-секрете обязаны
               отказывать (не пропускать); admin-доступ только через
               ?token=ADMIN_TOKEN; сырые PostGIS-запросы — на SQL-инъекции;
               секреты и PII в коде/логах.
            2. Конвенции: soft delete через deleted_at (без paranoia/discard),
               enums с _prefix: true, даты dd.MM.yy, single quotes,
               # frozen_string_literal: true, цены через price_formatted.
            3. Инвариант каталога: Property — проекция Topnlab; правки,
               ломающие sync-логику (в т.ч. пропуск архивации при неполном
               обходе), — блокер.
            4. LLM: free-first цепочки (LLM_CHAIN_*), платные модели — только
               last-resort; перестановка платной модели вверх — замечание.
            5. Тесты: изменена доменная логика — жди spec'и в spec/services
               или соседних; сеть в спеках закрыта WebMock.
            6. Документация: устарели ли из-за diff AGENTS.md, .claude/memory/*,
               services/*/SERVICE.md, README.md (правила — docs/documentation-rules.md).

            Замечания — inline-комментариями к конкретным строкам diff.
            Итог — одним верхнеуровневым комментарием: вердикт
            (можно мерджить / нужны правки), список блокеров, список нит-пиков.

            ОБЯЗАТЕЛЬНО: первая строка итогового комментария — `HEAD: <HEAD SHA из шапки>`
            (полный sha), чтобы automerge.yml мог сопоставить вердикт с коммитом.
            ОБЯЗАТЕЛЬНО: самая последняя строка итогового комментария — ровно одна
            из двух машиночитаемых меток, без форматирования и без текста после неё:
              VERDICT: MERGE     — блокеров нет, PR можно вливать как есть
              VERDICT: CHANGES   — есть хотя бы один блокер
            Эту строку читает workflow automerge.yml; нит-пики без блокеров — это MERGE.

          # Read-only обзор diff + постинг комментариев; ветки не пушим.
          # kimi -p работает в auto-режиме: --allowedTools сами ничего не
          # запрещают, ограничивают только --disallowedTools (deny идут первыми).
          kimi_args: |
            --max-turns 50
            --disallowedTools "Write,Edit,Bash(git push:*),Bash(git commit:*),Bash(docker:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh secret:*),Bash(gh workflow:*),Bash(gh release:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(rg:*),Bash(grep:*),Bash(ls:*)"

      # Вердикт для automerge.yml — артефактом ЭТОГО прогона. Источник — не
      # комментарии (их пишет любой job под тем же github-actions[bot], в т.ч.
      # интерактивный @kimi), а транскрипт агента на диске раннера
      # (execution_file): туда пишет только шаг ревью выше. Берём ПОСЛЕДНИЕ
      # строки HEAD:/VERDICT: — финальный комментарий агента идёт последним,
      # а процитированный в diff текст (например, сам automerge.yml) — раньше.
      - name: Publish verdict artifact
        if: always()
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          VERDICT=CHANGES
          if [ -n "${EXEC_FILE:-}" ] && [ -s "$EXEC_FILE" ]; then
            # JSON-escaped текст: \n внутри строк — раскрываем, чтобы grep видел строки.
            TXT=$(sed 's/\\n/\n/g' "$EXEC_FILE")
            LAST_HEAD=$(grep -oE 'HEAD: [0-9a-f]{40}' <<<"$TXT" | tail -1 || true)
            LAST_VERDICT=$(grep -oE 'VERDICT: (MERGE|CHANGES)' <<<"$TXT" | tail -1 || true)
            echo "из транскрипта: '$LAST_HEAD' / '$LAST_VERDICT'"
            if [ "$LAST_HEAD" = "HEAD: $SHA" ] && [ "$LAST_VERDICT" = "VERDICT: MERGE" ]; then VERDICT=MERGE; fi
          else
            echo "execution_file отсутствует — вердикт CHANGES по умолчанию"
          fi
          mkdir -p verdict
          printf 'HEAD: %s\nRUN: %s\nVERDICT: %s\n' "$SHA" "$GITHUB_RUN_ID" "$VERDICT" > verdict/kimi-verdict.txt
          cat verdict/kimi-verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-verdict
          path: verdict/kimi-verdict.txt
          retention-days: 7

  opencode-review:
    name: OpenCode Review
    # PR-авто (opened/synchronize/reopened/ready_for_review, не draft) + ручной
    # запуск workflow_dispatch на любом открытом PR (inputs.pr_number).
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # OIDC-обмен на краткосрочный OPENCODE_API_KEY (service account Console)
      contents: read
      pull-requests: write
      actions: read

    # Новый push в PR отменяет устаревшее ревью в полёте.
    # Для dispatch — группа по введённому номеру PR.
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # PR-контекст для обоих режимов: из события (pull_request) или из
      # ввода (workflow_dispatch). pr_number валидируем строго цифрами,
      # head sha достаём через gh — при dispatch github.event.pull_request
      # пустой.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr="$INPUT_PR"
          else
            pr="$EVENT_PR"
          fi
          case "$pr" in ''|*[!0-9]*)
            echo "pr_number должен быть числом: '$pr'" >&2; exit 1;;
          esac
          head=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' | tr -d '"')
          # NB: --jq -r НЕ работает (pflag съедает -r значением --jq →
          # «received 2»); кавычки JSON-строки снимаем tr -d.
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "ревью PR #$pr @ $head"

      # Аутентификация без долгоживущего секрета: OIDC-токен прогона меняется
      # на краткосрочный OPENCODE_API_KEY сервис-аккаунта OpenCode Console.
      # Сниппет — из Console (Settings → Service accounts). client_id хранится
      # в GitHub Secret (OPENCODE_CLIENT_ID) и подставляется в запрос; обмен
      # всё равно требует OIDC-токен конкретного прогона этого репозитория.
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          set -euo pipefail
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="${{ secrets.OPENCODE_CLIENT_ID }}" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "OIDC-обмен не выдал токен (ответ: $(curl -s https://opencode.ai/console/auth/oauth/token -o /dev/null -w '%{http_code}'))" >&2
            exit 1
          fi
          # Диагностика: сразу проверить ключ на inference API — отделяет
          # «ключ невалиден/квота» от «бинарь opencode падает сам».
          val=$(curl -s -o /tmp/oc_val -w "%{http_code}" -H "Authorization: Bearer $token" \
            "https://opencode.ai/inference/openai/v1/models")
          echo "проверка ключа на inference /models: HTTP $val"
          if [ "$val" != "200" ]; then echo "тело ответа:"; head -c 300 /tmp/oc_val; echo; exit 1; fi
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          set -euo pipefail
          # Скачивание в файл + ретраи: curl|bash обрывался на ~92%
          # (job падал с exit 127 на opencode --version, PR #258).
          for i in 1 2 3; do
            curl -fsSL https://opencode.ai/install -o /tmp/oc-install.sh && break
            echo "retry $i"; sleep 5
          done
          bash /tmp/oc-install.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          # Полный путь: GITHUB_PATH действует со СЛЕДУЮЩЕГО шага.
          "$HOME/.opencode/bin/opencode" --version

      # Read-only обзор diff + постинг одного верхнеуровневого комментария
      # через gh (GITHUB_TOKEN). Модель — opencode-go/glm-5.3 (подписка Go):
      # расход агента идёт на бюджет сервис-аккаунта Console, а не Kimi-план.
      # Пишущие инструменты запрещены permission.bash (схема opencode 1.x:
      # карта «паттерн → deny»; формат-массив из 2.x не валидируется) + --auto
      # одобряет только то, что не запрещено явно.
      - name: Run OpenCode Review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # PR_NUMBER и HEAD_SHA — из шага Resolve PR context ($GITHUB_ENV):
          # при workflow_dispatch github.event.pull_request пустой.
        run: |
          set -uo pipefail
          cat > opencode.json <<'JSON'
          {
            "permission": {
              "bash": {
                "git push:*": "deny",
                "git commit:*": "deny",
                "git checkout:*": "deny",
                "docker:*": "deny",
                "gh pr merge:*": "deny",
                "gh pr edit:*": "deny",
                "gh pr close:*": "deny",
                "gh pr review:*": "deny",
                "gh issue close:*": "deny",
                "gh issue edit:*": "deny",
                "gh secret:*": "deny",
                "gh variable:*": "deny",
                "gh workflow:*": "deny",
                "gh release:*": "deny",
                "gh repo:*": "deny",
                "gh api:*": "deny",
                "curl:*": "deny",
                "wget:*": "deny"
              }
            }
          }
          JSON
          # NB: --standalone и --archived — флаги OpenCode 2.x; в 1.19.6 их
          # нет (yargs-strict → хелп в stderr, пустой stdout). Установщик
          # ставит линейку 1.x. Проверено в песочнице: run --auto --model
          # на 1.19.6 с SA-ключом работает.
          opencode run --auto --model opencode-go/glm-5.3 \
            "REPO: $REPO
          PR NUMBER: $PR_NUMBER
          HEAD SHA: $HEAD_SHA

          Проведи code review этого PR на русском языке. Сначала прочти
          AGENTS.md и .claude/memory/systemPatterns.md — это источник правды
          о проекте (Rails-монолит, доменная логика в app/services/).

          Фокус ревью:
          1. Безопасность: вебхук-контроллеры при пустом ENV-секрете обязаны
             отказывать (не пропускать); admin-доступ только через
             ?token=ADMIN_TOKEN; сырые PostGIS-запросы — на SQL-инъекции;
             секреты и PII в коде/логах.
          2. Конвенции: soft delete через deleted_at (без paranoia/discard),
             enums с _prefix: true, даты dd.MM.yy, single quotes,
             # frozen_string_literal: true, цены через price_formatted.
          3. Инвариант каталога: Property — проекция Topnlab; правки,
             ломающие sync-логику (в т.ч. пропуск архивации при неполном
             обходе), — блокер.
          4. LLM: free-first цепочки (LLM_CHAIN_*), платные модели — только
             last-resort; перестановка платной модели вверх — замечание.
          5. Тесты: изменена доменная логика — жди spec'и в spec/services
             или соседних; сеть в спеках закрыта WebMock.
          6. Документация: устарели ли из-за diff AGENTS.md, .claude/memory/*,
             services/*/SERVICE.md, README.md (правила — docs/documentation-rules.md).

          Получи diff командами «gh pr view \$PR_NUMBER --json baseRefName»
          и «gh pr diff \$PR_NUMBER» и ревьюй его.

          Опубликуй итог ОДНИМ верхнеуровневым комментарием PR: текст ревью
          запиши во временный файл (вне дерева репозитория) и выполни
          «gh pr comment \$PR_NUMBER --body-file <файл>». Другие write-
          операции (git, edit кода, иные gh-команды) НЕ выполняй.

          Структура текста ревью: вердикт (можно мерджить / нужны правки),
          список блокеров, список нит-пиков.

          ОБЯЗАТЕЛЬНО: предпоследняя строка финального ответа — ровно
          'HEAD: $HEAD_SHA' (полный sha), а самая последняя строка — ровно
          одна из двух машиночитаемых меток, без форматирования и без текста
          после неё:
            VERDICT: MERGE     — блокеров нет, PR можно вливать как есть
            VERDICT: CHANGES   — есть хотя бы один блокер
          Эти строки читает workflow automerge.yml; нит-пики без блокеров — это MERGE." \
            > review-transcript.txt 2> review-stderr.txt || true
          echo "--- stderr (head 2000c) ---"; head -c 2000 review-stderr.txt || true; echo
          echo "--- stderr (tail) ---"; tail -5 review-stderr.txt || true
          echo "--- transcript bytes: $(wc -c < review-transcript.txt)"

      # Вердикт для automerge.yml — артефактом ЭТОГО прогона. Источник — не
      # комментарии (их пишет любой job под тем же github-actions[bot], в т.ч.
      # интерактивный бот), а транскрипт агента на диске раннера
      # (review-transcript.txt): туда пишет только шаг ревью выше. Берём
      # ПОСЛЕДНИЕ строки HEAD:/VERDICT: — финальный ответ агента идёт
      # последним, а процитированный в diff текст — раньше.
      # ВАЖНО: при невалидном вердикте (нет транскрипта / нет HEAD/VERDICT)
      # job ПАДАЕТ — это сигнал automerge.yml уйти в fallback на Kimi Review.
      # Валидный CHANGES — не падение: артефакт с VERDICT: CHANGES просто
      # блокирует мерж.
      - name: Publish verdict artifact
        if: always()
        env:
          SHA: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          VERDICT=CHANGES
          VALID=0
          if [ -s review-transcript.txt ]; then
            LAST_HEAD=$(grep -oE 'HEAD: [0-9a-f]{40}' review-transcript.txt | tail -1 || true)
            LAST_VERDICT=$(grep -oE 'VERDICT: (MERGE|CHANGES)' review-transcript.txt | tail -1 || true)
            echo "из транскрипта: '$LAST_HEAD' / '$LAST_VERDICT'"
            if [ "$LAST_HEAD" = "HEAD: $SHA" ] && [ -n "$LAST_VERDICT" ]; then
              VALID=1
              if [ "$LAST_VERDICT" = "VERDICT: MERGE" ]; then VERDICT=MERGE; fi
            fi
          else
            echo "транскрипт отсутствует"
          fi
          mkdir -p verdict
          printf 'HEAD: %s\nRUN: %s\nVERDICT: %s\n' "$SHA" "$GITHUB_RUN_ID" "$VERDICT" > verdict/opencode-verdict.txt
          cat verdict/opencode-verdict.txt
          if [ "$VALID" != 1 ]; then
            echo "валидный вердикт не получен — job failed → automerge уйдёт в fallback на Kimi Review"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-verdict
          path: verdict/opencode-verdict.txt
          retention-days: 7

  kimi:
    name: Kimi Code
    # Gate пропускает упоминания обоих ботов: @kimi и @claude (алиас).
    # Экшен внутри себя ищет ровно одну trigger_phrase, поэтому ниже она
    # подставляется динамически — та, что реально встретилась в событии.
    if: |
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@kimi') || contains(github.event.comment.body, '@claude'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@kimi') || contains(github.event.comment.body, '@claude'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@kimi') || contains(github.event.review.body, '@claude'))) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@kimi') || contains(github.event.issue.title, '@kimi') || contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # Least privilege: читаем код/PR/issue, пишем комментарии и ветки kimi/*.
    # contents: write нужен, если агент будет пушить ветки (branch_prefix ниже);
    # для чистого Q&A-бота можно оставить contents: read.
    # actions:read — бот видит логи красного CI, а не гадает о причине падения.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    # Один прогон Kimi на issue/PR; прогон в полёте не отменяем —
    # недописанный тред хуже, чем очередь.
    concurrency:
      group: kimi-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Kimi Code
        id: kimi
        uses: xuwenhao/kimi-code-action@v0   # для продакшена запиньте на SHA коммита
        with:
          # Алиас @claude: экшен ищет ровно одну trigger_phrase (gate job'ы
          # выше пропускает оба упоминания), поэтому подставляем ту, что
          # реально встретилась в ПОЛЯХ ТЕКУЩЕГО события: на issue_comment
          # экшен проверяет только comment.body, и учёт issue.body сломал бы
          # триггер (issue с @kimi в описании + комментарий только с @claude).
          trigger_phrase: ${{ ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@kimi')) || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@kimi')) || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@kimi')) || (github.event_name == 'issues' && (contains(github.event.issue.body, '@kimi') || contains(github.event.issue.title, '@kimi')))) && '@kimi' || '@claude' }}

          # API-ключ: Kimi Code Console (kimi_platform: code; k3/k3.1-pro —
          # план Moderato+, ниже — kimi-for-coding) или Open Platform — тогда
          # kimi_platform: open-cn / open-intl и своя модель.
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_platform: code
          kimi_model: kimi-for-coding

          # Один комментарий на прогон вместо цепочки.
          use_sticky_comment: true

          # Ветки агента — kimi/* вместо claude/*.
          branch_prefix: kimi/

          # Лимиты. --max-turns — потолок на runaway-прогон.
          # Ruby/Postgres/стека в раннере НЕТ — линтеры и спеки гоняет
          # отдельный workflow «Lint & security»; docker тут бесполезен и опасен
          # (privileged-контейнер рядом с KIMI_API_KEY и токеном contents: write).
          # kimi -p в auto-режиме: ограничивают только --disallowedTools, а
          # --allowedTools — лишь исключения из них. gh — только read-only.
          kimi_args: |
            --max-turns 50
            --disallowedTools "Bash(docker:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh issue edit:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh release:*),Bash(gh repo:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(rg:*),Bash(grep:*),Bash(ls:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr checks:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
