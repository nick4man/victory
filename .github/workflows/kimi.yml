name: Kimi Code

# Два режима в одном workflow:
# 1) review — авторевью каждого PR (code-review diff — обязательный этап
#    каждого PR по AGENTS.md, здесь он автоматизирован);
# 2) kimi — бот отвечает на @kimi в issue/PR-комментариях и ревью.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    name: Kimi Review
    # Только события PR; черновики пропускаем (ready_for_review подхватит).
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: read

    # Новый push в PR отменяет устаревшее ревью в полёте.
    concurrency:
      group: kimi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Kimi Review
        uses: xuwenhao/kimi-code-action@v0 # для продакшена запиньте на SHA коммита
        with:
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_platform: code
          kimi_model: k3.1-pro

          # Трекинг-прогресс одним sticky-комментарием.
          track_progress: true
          use_sticky_comment: true

          # Наличие prompt переводит action в automation-режим (без @kimi).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Проведи code review этого PR на русском языке. Сначала прочти
            AGENTS.md и .claude/memory/systemPatterns.md — это источник правды
            о проекте (Rails-монолит, доменная логика в app/services/).

            Фокус ревью:
            1. Безопасность: вебхук-контроллеры при пустом ENV-секрете обязаны
               отказывать (не пропускать); admin-доступ только через
               ?token=ADMIN_TOKEN; сырые PostGIS-запросы — на SQL-инъекции;
               секреты и PII в коде/логах.
            2. Конвенции: soft delete через deleted_at (без paranoia/discard),
               enums с _prefix: true, даты dd.MM.yy, single quotes,
               # frozen_string_literal: true, цены через price_formatted.
            3. Инвариант каталога: Property — проекция Topnlab; правки,
               ломающие sync-логику (в т.ч. пропуск архивации при неполном
               обходе), — блокер.
            4. LLM: free-first цепочки (LLM_CHAIN_*), платные модели — только
               last-resort; перестановка платной модели вверх — замечание.
            5. Тесты: изменена доменная логика — жди spec'и в spec/services
               или соседних; сеть в спеках закрыта WebMock.
            6. Документация: устарели ли из-за diff AGENTS.md, .claude/memory/*,
               services/*/SERVICE.md, README.md (правила — docs/documentation-rules.md).

            Замечания — inline-комментариями к конкретным строкам diff.
            Итог — одним верхнеуровневым комментарием: вердикт
            (можно мерджить / нужны правки), список блокеров, список нит-пиков.

            ОБЯЗАТЕЛЬНО: первая строка итогового комментария — `HEAD: <HEAD SHA из шапки>`
            (полный sha), чтобы automerge.yml мог сопоставить вердикт с коммитом.
            ОБЯЗАТЕЛЬНО: самая последняя строка итогового комментария — ровно одна
            из двух машиночитаемых меток, без форматирования и без текста после неё:
              VERDICT: MERGE     — блокеров нет, PR можно вливать как есть
              VERDICT: CHANGES   — есть хотя бы один блокер
            Эту строку читает workflow automerge.yml; нит-пики без блокеров — это MERGE.

          # Read-only обзор diff + постинг комментариев; ветки не пушим.
          # kimi -p работает в auto-режиме: --allowedTools сами ничего не
          # запрещают, ограничивают только --disallowedTools (deny идут первыми).
          kimi_args: |
            --max-turns 50
            --disallowedTools "Write,Edit,Bash(git push:*),Bash(git commit:*),Bash(docker:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh secret:*),Bash(gh workflow:*),Bash(gh release:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(rg:*),Bash(grep:*),Bash(ls:*)"

      # Вердикт для automerge.yml — артефактом ЭТОГО прогона, а не комментарием.
      # Комментарий бота может оставить любой job под тем же github-actions[bot]
      # (в т.ч. интерактивный @kimi), артефакт kimi-verdict создаёт только этот
      # job в run с event=pull_request. Берём sticky-комментарий, который ссылается
      # на наш собственный run_id, — его написал только что отработавший шаг выше.
      - name: Publish verdict artifact
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/$GH_REPO/issues/$NUM/comments?per_page=100" --paginate --jq \
            '.[] | select(.user.login=="github-actions[bot]") | select(.body | contains("/actions/runs/'"$GITHUB_RUN_ID"'")) | .body' \
            | tail -n 400)
          FIRST=$(grep -m1 -E '^HEAD: [0-9a-f]{40}$' <<<"$BODY" || true)
          LAST=$(grep -v '^[[:space:]]*$' <<<"$BODY" | tail -1 || true)
          VERDICT=CHANGES
          if [ "$FIRST" = "HEAD: $SHA" ] && [ "$LAST" = "VERDICT: MERGE" ]; then VERDICT=MERGE; fi
          mkdir -p verdict
          printf 'HEAD: %s\nRUN: %s\nVERDICT: %s\n' "$SHA" "$GITHUB_RUN_ID" "$VERDICT" > verdict/kimi-verdict.txt
          cat verdict/kimi-verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-verdict
          path: verdict/kimi-verdict.txt
          retention-days: 7

  kimi:
    name: Kimi Code
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@kimi')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@kimi')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@kimi')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@kimi') || contains(github.event.issue.title, '@kimi')))
    runs-on: ubuntu-latest

    # Least privilege: читаем код/PR/issue, пишем комментарии и ветки kimi/*.
    # contents: write нужен, если агент будет пушить ветки (branch_prefix ниже);
    # для чистого Q&A-бота можно оставить contents: read.
    # actions:read — бот видит логи красного CI, а не гадает о причине падения.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    # Один прогон Kimi на issue/PR; прогон в полёте не отменяем —
    # недописанный тред хуже, чем очередь.
    concurrency:
      group: kimi-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Kimi Code
        id: kimi
        uses: xuwenhao/kimi-code-action@v0   # для продакшена запиньте на SHA коммита
        with:
          # API-ключ: Kimi Code Console (kimi_platform: code; k3/k3.1-pro —
          # план Moderato+, ниже — kimi-for-coding) или Open Platform — тогда
          # kimi_platform: open-cn / open-intl и своя модель.
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_platform: code
          kimi_model: kimi-for-coding

          # Один комментарий на прогон вместо цепочки.
          use_sticky_comment: true

          # Ветки агента — kimi/* вместо claude/*.
          branch_prefix: kimi/

          # Лимиты. --max-turns — потолок на runaway-прогон.
          # Ruby/Postgres/стека в раннере НЕТ — линтеры и спеки гоняет
          # отдельный workflow «Lint & security»; docker тут бесполезен и опасен
          # (privileged-контейнер рядом с KIMI_API_KEY и токеном contents: write).
          # kimi -p в auto-режиме: ограничивают только --disallowedTools, а
          # --allowedTools — лишь исключения из них. gh — только read-only.
          kimi_args: |
            --max-turns 50
            --disallowedTools "Bash(docker:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh issue edit:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh release:*),Bash(gh repo:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(rg:*),Bash(grep:*),Bash(ls:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr checks:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
