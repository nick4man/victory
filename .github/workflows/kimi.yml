name: Kimi Code

# Два режима в одном workflow:
# 1) review — авторевью каждого PR (code-review diff — обязательный этап
#    каждого PR по AGENTS.md, здесь он автоматизирован);
# 2) kimi — бот отвечает на @kimi в issue/PR-комментариях и ревью.
#    @claude — алиас к тому же job'у: claude.yml удалён (OAuth-подписка
#    Claude не продлевается), экшен умеет искать ровно одну trigger_phrase,
#    поэтому фраза подставляется динамически — та, что реально есть
#    в событии.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    name: Kimi Review
    # Только события PR; черновики пропускаем (ready_for_review подхватит).
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # OIDC-обмен на краткосрочный OPENCODE_API_KEY (service account Console)
      contents: read
      pull-requests: write
      actions: read

    # Новый push в PR отменяет устаревшее ревью в полёте.
    concurrency:
      group: kimi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Аутентификация без долгоживущего секрета: OIDC-токен прогона меняется
      # на краткосрочный OPENCODE_API_KEY сервис-аккаунта OpenCode Console.
      # Сниппет — из Console (Settings → Service accounts); client_id —
      # публичный идентификатор сервис-аккаунта (не секрет), обмен всё равно
      # требует OIDC-токен конкретного прогона этого репозитория.
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          set -euo pipefail
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_eb657298-922a-4cf9-a85f-28f27d8ba16a \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version

      # Read-only обзор diff + постинг одного верхнеуровневого комментария
      # через gh (GITHUB_TOKEN). Модель — opencode-go/glm-5.3 (подписка Go):
      # расход агента идёт на бюджет сервис-аккаунта Console, а не Kimi-план.
      # Пишущие инструменты запрещены permission.deny (opencode.json) +
      # --auto одобряет только то, что не запрещено явно. Транскрипт прогона
      # (stdout) — источник вердикта для automerge.yml.
      - name: Run OpenCode Review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cat > opencode.json <<'JSON'
          {
            "permission": {
              "deny": [
                "Bash(git push:*)", "Bash(git commit:*)", "Bash(git checkout:*)",
                "Bash(docker:*)",
                "Bash(gh pr merge:*)", "Bash(gh pr edit:*)", "Bash(gh pr close:*)",
                "Bash(gh pr review:*)", "Bash(gh issue close:*)", "Bash(gh issue edit:*)",
                "Bash(gh secret:*)", "Bash(gh variable:*)", "Bash(gh workflow:*)",
                "Bash(gh release:*)", "Bash(gh repo:*)", "Bash(gh api:*)",
                "Bash(curl:*)", "Bash(wget:*)"
              ]
            }
          }
          JSON
          opencode run --standalone --auto --archived --model opencode-go/glm-5.3 \
            "REPO: $REPO
          PR NUMBER: $PR_NUMBER
          HEAD SHA: $HEAD_SHA

          Проведи code review этого PR на русском языке. Сначала прочти
          AGENTS.md и .claude/memory/systemPatterns.md — это источник правды
          о проекте (Rails-монолит, доменная логика в app/services/).

          Фокус ревью:
          1. Безопасность: вебхук-контроллеры при пустом ENV-секрете обязаны
             отказывать (не пропускать); admin-доступ только через
             ?token=ADMIN_TOKEN; сырые PostGIS-запросы — на SQL-инъекции;
             секреты и PII в коде/логах.
          2. Конвенции: soft delete через deleted_at (без paranoia/discard),
             enums с _prefix: true, даты dd.MM.yy, single quotes,
             # frozen_string_literal: true, цены через price_formatted.
          3. Инвариант каталога: Property — проекция Topnlab; правки,
             ломающие sync-логику (в т.ч. пропуск архивации при неполном
             обходе), — блокер.
          4. LLM: free-first цепочки (LLM_CHAIN_*), платные модели — только
             last-resort; перестановка платной модели вверх — замечание.
          5. Тесты: изменена доменная логика — жди spec'и в spec/services
             или соседних; сеть в спеках закрыта WebMock.
          6. Документация: устарели ли из-за diff AGENTS.md, .claude/memory/*,
             services/*/SERVICE.md, README.md (правила — docs/documentation-rules.md).

          Получи diff командами «gh pr view \$PR_NUMBER --json baseRefName»
          и «gh pr diff \$PR_NUMBER» и ревьюй его.

          Опубликуй итог ОДНИМ верхнеуровневым комментарием PR: текст ревью
          запиши во временный файл (вне дерева репозитория) и выполни
          «gh pr comment \$PR_NUMBER --body-file <файл>». Другие write-
          операции (git, edit кода, иные gh-команды) НЕ выполняй.

          Структура текста ревью: вердикт (можно мерджить / нужны правки),
          список блокеров, список нит-пиков.

          ОБЯЗАТЕЛЬНО: предпоследняя строка финального ответа — ровно
          'HEAD: $HEAD_SHA' (полный sha), а самая последняя строка — ровно
          одна из двух машиночитаемых меток, без форматирования и без текста
          после неё:
            VERDICT: MERGE     — блокеров нет, PR можно вливать как есть
            VERDICT: CHANGES   — есть хотя бы один блокер
          Эти строки читает workflow automerge.yml; нит-пики без блокеров — это MERGE." \
            > review-transcript.txt 2> review-stderr.txt || true
          echo "--- stderr (tail) ---"; tail -5 review-stderr.txt || true
          echo "--- transcript bytes: $(wc -c < review-transcript.txt)"

      # Вердикт для automerge.yml — артефактом ЭТОГО прогона. Источник — не
      # комментарии (их пишет любой job под тем же github-actions[bot], в т.ч.
      # интерактивный бот), а транскрипт агента на диске раннера
      # (review-transcript.txt): туда пишет только шаг ревью выше. Берём
      # ПОСЛЕДНИЕ строки HEAD:/VERDICT: — финальный ответ агента идёт
      # последним, а процитированный в diff текст — раньше.
      - name: Publish verdict artifact
        if: always()
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          VERDICT=CHANGES
          if [ -s review-transcript.txt ]; then
            LAST_HEAD=$(grep -oE 'HEAD: [0-9a-f]{40}' review-transcript.txt | tail -1 || true)
            LAST_VERDICT=$(grep -oE 'VERDICT: (MERGE|CHANGES)' review-transcript.txt | tail -1 || true)
            echo "из транскрипта: '$LAST_HEAD' / '$LAST_VERDICT'"
            if [ "$LAST_HEAD" = "HEAD: $SHA" ] && [ "$LAST_VERDICT" = "VERDICT: MERGE" ]; then VERDICT=MERGE; fi
          else
            echo "транскрипт отсутствует — вердикт CHANGES по умолчанию"
          fi
          mkdir -p verdict
          printf 'HEAD: %s\nRUN: %s\nVERDICT: %s\n' "$SHA" "$GITHUB_RUN_ID" "$VERDICT" > verdict/kimi-verdict.txt
          cat verdict/kimi-verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-verdict
          path: verdict/kimi-verdict.txt
          retention-days: 7

  kimi:
    name: Kimi Code
    # Gate пропускает упоминания обоих ботов: @kimi и @claude (алиас).
    # Экшен внутри себя ищет ровно одну trigger_phrase, поэтому ниже она
    # подставляется динамически — та, что реально встретилась в событии.
    if: |
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@kimi') || contains(github.event.comment.body, '@claude'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@kimi') || contains(github.event.comment.body, '@claude'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@kimi') || contains(github.event.review.body, '@claude'))) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@kimi') || contains(github.event.issue.title, '@kimi') || contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # Least privilege: читаем код/PR/issue, пишем комментарии и ветки kimi/*.
    # contents: write нужен, если агент будет пушить ветки (branch_prefix ниже);
    # для чистого Q&A-бота можно оставить contents: read.
    # actions:read — бот видит логи красного CI, а не гадает о причине падения.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    # Один прогон Kimi на issue/PR; прогон в полёте не отменяем —
    # недописанный тред хуже, чем очередь.
    concurrency:
      group: kimi-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Kimi Code
        id: kimi
        uses: xuwenhao/kimi-code-action@v0   # для продакшена запиньте на SHA коммита
        with:
          # Алиас @claude: экшен ищет ровно одну trigger_phrase (gate job'ы
          # выше пропускает оба упоминания), поэтому подставляем ту, что
          # реально встретилась в ПОЛЯХ ТЕКУЩЕГО события: на issue_comment
          # экшен проверяет только comment.body, и учёт issue.body сломал бы
          # триггер (issue с @kimi в описании + комментарий только с @claude).
          trigger_phrase: ${{ ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@kimi')) || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@kimi')) || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@kimi')) || (github.event_name == 'issues' && (contains(github.event.issue.body, '@kimi') || contains(github.event.issue.title, '@kimi')))) && '@kimi' || '@claude' }}

          # API-ключ: Kimi Code Console (kimi_platform: code; k3/k3.1-pro —
          # план Moderato+, ниже — kimi-for-coding) или Open Platform — тогда
          # kimi_platform: open-cn / open-intl и своя модель.
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_platform: code
          kimi_model: kimi-for-coding

          # Один комментарий на прогон вместо цепочки.
          use_sticky_comment: true

          # Ветки агента — kimi/* вместо claude/*.
          branch_prefix: kimi/

          # Лимиты. --max-turns — потолок на runaway-прогон.
          # Ruby/Postgres/стека в раннере НЕТ — линтеры и спеки гоняет
          # отдельный workflow «Lint & security»; docker тут бесполезен и опасен
          # (privileged-контейнер рядом с KIMI_API_KEY и токеном contents: write).
          # kimi -p в auto-режиме: ограничивают только --disallowedTools, а
          # --allowedTools — лишь исключения из них. gh — только read-only.
          kimi_args: |
            --max-turns 50
            --disallowedTools "Bash(docker:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh issue edit:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh release:*),Bash(gh repo:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(rg:*),Bash(grep:*),Bash(ls:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr checks:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
