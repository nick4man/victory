# АН "Виктори" — Docker Compose stack
#
# Services:
#   db       – PostgreSQL 16
#   redis    – Redis 7  (Sidekiq queues + Rack::Attack + cache)
#   web      – Rails 7.1 / Puma (port 5000)
#   sidekiq  – Sidekiq worker (same image as web)
#   migrate  – one-off migration runner (run manually)
#
# Quick start:
#   cp .env.example .env          # fill in secrets
#   docker compose up --build -d
#   docker compose run --rm migrate
#
# Logs:
#   docker compose logs -f web
#   docker compose logs -f sidekiq

# ── Shared config fragments ────────────────────────────────────────────────────
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: final
  image: victory:latest
  env_file: .env
  environment:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - victory_net

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-viktory_realty_production}
      POSTGRES_USER: ${DATABASE_USERNAME:-victory}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - victory_net
    ports:
      - "127.0.0.1:5432:5432"        # localhost only — not exposed to internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${DATABASE_USERNAME:-victory} -d ${DATABASE_NAME:-viktory_realty_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - victory_net
    ports:
      - "127.0.0.1:6379:6379"        # localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Rails web ────────────────────────────────────────────────────────────────
  web:
    <<: *app
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - storage:/app/storage            # Active Storage uploads
      - assets:/app/public/assets       # pre-compiled assets (shared with nginx if added)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Sidekiq worker ────────────────────────────────────────────────────────────
  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - storage:/app/storage            # needs access to Active Storage
    healthcheck:
      test: ["CMD-SHELL", "bundle exec sidekiq --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── One-off migration runner ──────────────────────────────────────────────────
  # Run manually:  docker compose run --rm migrate
  # Or set AUTO_MIGRATE=true in .env to run automatically on web startup.
  migrate:
    <<: *app
    command: bundle exec rails db:migrate
    restart: "no"
    healthcheck:
      disable: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage:
    driver: local
  assets:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  victory_net:
    driver: bridge
